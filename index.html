<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>饮料酒水库存管理</title>
  <style>
    :root{
      --bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;
      --primary:#17324d;--green:#087f5b;--red:#c92a2a;--amber:#c47f00;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
    header{background:var(--primary);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
    h1{font-size:21px;margin:0}.subtitle{font-size:12px;opacity:.8;margin-top:4px}
    main{max-width:1200px;margin:20px auto;padding:0 14px}
    .hidden{display:none!important}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
    .login{max-width:430px;margin:65px auto}.login input{width:100%;margin:6px 0}
    input,select,button{font:inherit}input,select{padding:10px;border:1px solid #d7dce2;border-radius:10px;background:#fff}
    button{padding:10px 14px;border:0;border-radius:10px;background:var(--primary);color:#fff;cursor:pointer}
    button.secondary{background:#e9edf2;color:#172033}button.green{background:var(--green)}button.red{background:var(--red)}
    .topuser{display:flex;align-items:center;gap:10px;font-size:13px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
    .stat small{color:var(--muted)}.stat b{display:block;font-size:28px;margin-top:8px}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{min-width:250px}
    .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-head h2{margin:0;font-size:18px}
    .tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:850px}
    th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 8px}th{font-size:12px;color:#6b7280;background:#fafbfc}
    .pill{padding:3px 8px;border-radius:999px;background:#edf1f5;font-size:12px}
    .low{color:var(--red);font-weight:700}.ok{color:var(--green);font-weight:700}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:12px;padding:6px 9px}
    dialog{border:0;border-radius:15px;width:min(520px,calc(100% - 24px));padding:0;box-shadow:0 25px 80px rgba(0,0,0,.28)}
    dialog::backdrop{background:rgba(0,0,0,.4)}.modal{padding:18px}.modal h3{margin:0 0 14px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 label{font-size:12px;color:#6b7280;display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}
    .modalfooter{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
    .msg{font-size:13px;color:var(--red)}
    @media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.full{grid-column:auto}.toolbar input{min-width:100%;width:100%}}
  </style>
</head>
<body>
<header>
  <div>
    <h1>饮料酒水库存管理</h1>
    <div class="subtitle">Restaurant Beverage Inventory · Supabase</div>
  </div>
  <div class="topuser">
    <span id="userEmail"></span>
    <button id="logoutBtn" class="secondary hidden">退出</button>
  </div>
</header>

<main>
  <section id="loginView" class="card login">
    <h2>员工登录</h2>
    <p style="color:#6b7280;font-size:13px">3个人可分别使用自己的账号，库存实时共用。</p>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="密码">
    <button id="loginBtn" style="width:100%;margin-top:8px">登录</button>
    <p id="loginMsg" class="msg"></p>
  </section>

  <section id="appView" class="hidden">
    <div class="stats">
      <div class="card stat"><small>酒水品项</small><b id="statItems">0</b></div>
      <div class="card stat"><small>总库存</small><b id="statQty">0</b></div>
      <div class="card stat"><small>低库存</small><b id="statLow">0</b></div>
      <div class="card stat"><small>今日操作</small><b id="statToday">0</b></div>
    </div>

    <div class="toolbar">
      <input id="search" placeholder="搜索名称 / 类别 / 规格">
      <select id="categoryFilter"><option value="">全部类别</option></select>
      <button id="addBtn">＋ 新增酒水</button>
      <button id="refreshBtn" class="secondary">刷新</button>
    </div>

    <div class="card tablewrap">
      <div class="section-head"><h2>当前库存</h2><span id="updatedAt" style="font-size:12px;color:#6b7280"></span></div>
      <table>
        <thead><tr><th>名称</th><th>类别</th><th>规格</th><th>单位</th><th>库存</th><th>最低库存</th><th>成本</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="inventoryBody"></tbody>
      </table>
    </div>

    <div class="card tablewrap" style="margin-top:14px">
      <div class="section-head"><h2>最近操作记录</h2><span style="font-size:12px;color:#6b7280">最近 80 条</span></div>
      <table>
        <thead><tr><th>时间</th><th>酒水</th><th>操作</th><th>数量</th><th>备注</th><th>操作人</th></tr></thead>
        <tbody id="logBody"></tbody>
      </table>
    </div>
  </section>
</main>

<dialog id="itemDialog">
  <div class="modal">
    <h3 id="itemTitle">新增酒水</h3>
    <div class="grid2">
      <label class="full">名称<input id="itemName" placeholder="例：Tiger Beer"></label>
      <label>类别<select id="itemCategory">
        <option>啤酒</option><option>红酒</option><option>白酒</option><option>烈酒</option>
        <option>汽水</option><option>果汁</option><option>矿泉水</option><option>茶饮</option><option>其他</option>
      </select></label>
      <label>规格<input id="itemSpec" placeholder="330ml / 750ml"></label>
      <label>单位<input id="itemUnit" value="瓶"></label>
      <label>当前库存<input id="itemQty" type="number" min="0" step="0.01" value="0"></label>
      <label>最低库存<input id="itemMin" type="number" min="0" step="0.01" value="5"></label>
      <label>成本价 SGD<input id="itemCost" type="number" min="0" step="0.01" value="0"></label>
    </div>
    <div class="modalfooter">
      <button class="secondary" onclick="itemDialog.close()">取消</button>
      <button id="saveItemBtn">保存</button>
    </div>
  </div>
</dialog>

<dialog id="stockDialog">
  <div class="modal">
    <h3 id="stockTitle">库存操作</h3>
    <div class="grid2">
      <label>操作<select id="stockAction"><option value="IN">入库</option><option value="OUT">出库</option><option value="ADJUST">盘点调整</option></select></label>
      <label>数量<input id="stockQty" type="number" min="0" step="0.01"></label>
      <label class="full">备注<input id="stockNote" placeholder="供应商送货 / 包厢领用 / 盘点修正"></label>
    </div>
    <div class="modalfooter">
      <button class="secondary" onclick="stockDialog.close()">取消</button>
      <button id="saveStockBtn">确认</button>
    </div>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
