<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>饮料酒水库存管理</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--primary:#17324d;--green:#087f5b;--red:#c92a2a;--amber:#c47f00}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
    header{background:var(--primary);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:21px;margin:0}.subtitle{font-size:12px;opacity:.8;margin-top:4px}
    main{max-width:1250px;margin:20px auto;padding:0 14px}.hidden{display:none!important}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
    .login{max-width:430px;margin:65px auto}.login input{width:100%;margin:6px 0}input,select,button{font:inherit}input,select{padding:10px;border:1px solid #d7dce2;border-radius:10px;background:#fff}button{padding:10px 14px;border:0;border-radius:10px;background:var(--primary);color:#fff;cursor:pointer}button.secondary{background:#e9edf2;color:#172033}button.green{background:var(--green)}button.red{background:var(--red)}
    .topuser{display:flex;align-items:center;gap:10px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}.stat small{color:var(--muted)}.stat b{display:block;font-size:28px;margin-top:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{min-width:250px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}.section-head h2{margin:0;font-size:18px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:900px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 8px}th{font-size:12px;color:#6b7280;background:#fafbfc}.pill{padding:3px 8px;border-radius:999px;background:#edf1f5;font-size:12px}.low{color:var(--red);font-weight:700}.ok{color:var(--green);font-weight:700}.money{color:var(--amber);font-weight:700}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:12px;padding:6px 9px}.linkbtn{background:none;color:var(--primary);padding:0;font-weight:700;text-decoration:underline;text-underline-offset:3px}
    dialog{border:0;border-radius:15px;width:min(540px,calc(100% - 24px));padding:0;box-shadow:0 25px 80px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(0,0,0,.4)}.modal{padding:18px}.modal h3{margin:0 0 14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 label{font-size:12px;color:#6b7280;display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}.modalfooter{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.msg{font-size:13px;color:var(--red)}.hint{font-size:12px;color:var(--muted);margin-top:4px}
    .drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(430px,94vw);background:#fff;z-index:50;box-shadow:-12px 0 40px rgba(0,0,0,.18);padding:22px;overflow:auto}.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}.drawer-head h2{margin:0;font-size:22px}.drawer-close{background:#eef1f5;color:#172033;font-size:20px;padding:6px 11px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.detail-box{border:1px solid var(--line);border-radius:12px;padding:12px}.detail-box small{display:block;color:var(--muted);margin-bottom:5px}.detail-box b{font-size:17px}.drawer-actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}.danger-zone{margin-top:24px;border:1px solid #ffd1d1;background:#fff6f6;border-radius:12px;padding:14px}.danger-zone h3{margin:0 0 6px;color:var(--red);font-size:15px}.danger-zone p{font-size:12px;color:#6b7280;line-height:1.5}
    @media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.full{grid-column:auto}.toolbar input{min-width:100%;width:100%}}
  </style>
</head>
<body>
<header><div><h1>饮料酒水库存管理</h1><div class="subtitle">Restaurant Beverage Inventory · Supabase</div></div><div class="topuser"><span id="userEmail"></span><button id="logoutBtn" class="secondary hidden">退出</button></div></header>
<main>
  <section id="loginView" class="card login"><h2>员工登录</h2><p style="color:#6b7280;font-size:13px">多人可分别使用自己的账号，库存与提成实时共用。</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="密码"><button id="loginBtn" style="width:100%;margin-top:8px">登录</button><p id="loginMsg" class="msg"></p></section>
  <section id="appView" class="hidden">
    <div class="stats"><div class="card stat"><small>酒水品项</small><b id="statItems">0</b></div><div class="card stat"><small>总库存</small><b id="statQty">0</b></div><div class="card stat"><small>低库存</small><b id="statLow">0</b></div><div class="card stat"><small>今日操作</small><b id="statToday">0</b></div><div class="card stat"><small>今日提成</small><b id="statCommission">$0.00</b></div></div>
    <div class="toolbar"><input id="search" placeholder="搜索名称 / 类别 / 规格"><select id="categoryFilter"><option value="">全部类别</option></select><button id="addBtn">＋ 新增酒水</button><button id="refreshBtn" class="secondary">刷新</button></div>
    <div class="card tablewrap"><div class="section-head"><h2>当前库存</h2><span id="updatedAt" style="font-size:12px;color:#6b7280"></span></div><table><thead><tr><th>名称</th><th>类别</th><th>规格</th><th>单位</th><th>库存</th><th>最低库存</th><th>成本</th><th>每单位提成</th><th>状态</th><th>操作</th></tr></thead><tbody id="inventoryBody"></tbody></table></div>
    <div class="card tablewrap" style="margin-top:14px"><div class="section-head"><h2>员工提成记录</h2><span style="font-size:12px;color:#6b7280">卖出酒水时自动计算</span></div><table><thead><tr><th>时间</th><th>员工</th><th>酒水</th><th>卖出数量</th><th>单件提成</th><th>提成金额</th><th>操作人</th></tr></thead><tbody id="commissionBody"></tbody></table></div>
    <div class="card tablewrap" style="margin-top:14px"><div class="section-head"><h2>最近操作记录</h2><span style="font-size:12px;color:#6b7280">最近 80 条</span></div><table><thead><tr><th>时间</th><th>酒水</th><th>操作</th><th>数量</th><th>备注</th><th>操作人</th></tr></thead><tbody id="logBody"></tbody></table></div>
  </section>
</main>
<dialog id="itemDialog"><div class="modal"><h3 id="itemTitle">新增酒水</h3><div class="grid2"><label class="full">名称<input id="itemName" placeholder="例：Tiger Beer"></label><label>类别<select id="itemCategory"><option>啤酒</option><option>红酒</option><option>白酒</option><option>烈酒</option><option>汽水</option><option>果汁</option><option>矿泉水</option><option>茶饮</option><option>其他</option></select></label><label>规格<input id="itemSpec" placeholder="330ml / 750ml"></label><label>单位<input id="itemUnit" value="瓶"></label><label>当前库存<input id="itemQty" type="number" min="0" step="0.01" value="0"></label><label>最低库存<input id="itemMin" type="number" min="0" step="0.01" value="5"></label><label>成本价 SGD<input id="itemCost" type="number" min="0" step="0.01" value="0"></label><label>每单位提成 SGD<input id="itemCommission" type="number" min="0" step="0.01" value="0"><span class="hint">例：每卖 1 瓶提成 $2，就填 2</span></label></div><div class="modalfooter"><button class="secondary" onclick="itemDialog.close()">取消</button><button id="saveItemBtn">保存</button></div></div></dialog>
<dialog id="stockDialog"><div class="modal"><h3 id="stockTitle">库存操作</h3><div class="grid2"><label>操作<select id="stockAction"><option value="IN">入库</option><option value="OUT">卖出 / 出库</option><option value="ADJUST">盘点调整</option></select></label><label>数量<input id="stockQty" type="number" min="0" step="0.01"></label><label id="sellerWrap" class="full hidden">销售员工<input id="stockSeller" list="sellerList" placeholder="输入员工姓名"><datalist id="sellerList"></datalist><span class="hint">只有“卖出 / 出库”会计算提成</span></label><label class="full">备注<input id="stockNote" placeholder="供应商送货 / 客人购买 / 盘点修正"></label></div><div class="modalfooter"><button class="secondary" onclick="stockDialog.close()">取消</button><button id="saveStockBtn">确认</button></div></div></dialog>
<div id="drawerBackdrop" class="drawer-backdrop hidden" onclick="closeItemDrawer()"></div>
<aside id="itemDrawer" class="drawer hidden" aria-label="酒水详情">
  <div class="drawer-head"><h2 id="drawerName">酒水详情</h2><button class="drawer-close" onclick="closeItemDrawer()">×</button></div>
  <div id="drawerDetails" class="detail-grid"></div>
  <div class="drawer-actions"><button id="drawerInBtn" class="green">入库</button><button id="drawerOutBtn">卖出</button><button id="drawerEditBtn" class="secondary">编辑</button></div>
  <div class="danger-zone"><h3>删除错误酒水</h3><p>如果这条酒水资料是误加的，可以永久删除。以前的操作记录会保留，但这条酒水会从当前库存中消失。</p><button id="drawerDeleteBtn" class="red">删除这条酒水</button></div>
</aside>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script src="./app.js"></script>
</body></html>
